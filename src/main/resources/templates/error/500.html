
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error interno | VetControl Perú</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #edf8fa, #dceef5);
            color: #123e60;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .tarjeta {
            width: 100%;
            max-width: 580px;
            background: white;
            border: 1px solid #dce9ef;
            border-radius: 22px;
            padding: 48px 30px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(18,62,96,.10);
        }
        .logo {
            color: #118e98;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 25px;
        }
        .codigo {
            font-size: 88px;
            font-weight: 800;
            color: #dc5454;
            line-height: 1;
        }
        h1 { font-size: 28px; }
        p {
            color: #63788a;
            font-size: 16px;
            line-height: 1.7;
        }
        .acciones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }
        .boton {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            background: #1578c5;
            color: white;
        }
        .boton-secundario {
            background: #e8f1f4;
            color: #164b67;
        }
        .pie {
            margin-top: 30px;
            color: #8193a1;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="tarjeta">
        <div class="logo">🐾 VetControl Perú</div>
        <div class="codigo">500</div>
        <h1>Error interno del sistema</h1>

        <p>
            Ocurrió un inconveniente al procesar
            tu solicitud. Intenta nuevamente
            en unos momentos.
        </p>

        <p>
            Si el problema continúa, comunícate
            con el administrador de VetControl Perú.
        </p>

        <div class="acciones">
            <a th:href="@{/dashboard}" class="boton">
                Volver al Dashboard
            </a>
            <a href="javascript:history.back()"
               class="boton boton-secundario">
                Regresar
            </a>
        </div>

        <div class="pie">
            No se muestran detalles técnicos del error.
        </div>
    </main>
</body>
</html>
