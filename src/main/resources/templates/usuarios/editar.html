
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Editar Usuario | VetControl Perú</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            background: #edf5f8;
            color: #173b59;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .cabecera {
            background: linear-gradient(
                110deg, #123e63, #168f98
            );
            color: white;
            padding: 26px;
        }

        .contenedor {
            max-width: 950px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            padding: 32px;
            border-radius: 18px;
            border: 1px solid #dce7ed;
        }

        .form-label {
            font-weight: 600;
        }

        .titulo {
            color: #123e63;
            font-weight: 700;
        }
    </style>
</head>

<body>

<header class="cabecera">

    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3">

        <h1 class="h3 mb-0">
            Editar usuario
        </h1>

        <a th:href="@{/usuarios}"
           class="btn btn-light">
            Volver al listado
        </a>

    </div>
</header>

<main class="contenedor">

    <div th:if="${error}"
         th:text="${error}"
         class="alert alert-danger">
    </div>

    <section class="tarjeta">

        <h2 class="titulo h4 mb-3">
            Modificar datos de acceso
        </h2>

        <p class="text-secondary">
            Edite los datos del usuario seleccionado.
            La contraseña se administra por separado
            desde el listado.
        </p>

        <form th:action="@{/usuarios/{id}/actualizar(id=${usuario.idUsuario})}"
              th:object="${formulario}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="row g-3">

                <div class="col-md-6">

                    <label for="nombres"
                           class="form-label">
                        Nombre completo
                    </label>

                    <input id="nombres"
                           type="text"
                           th:field="*{nombres}"
                           maxlength="120"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">

                    <label for="username"
                           class="form-label">
                        Nombre de usuario
                    </label>

                    <input id="username"
                           type="text"
                           th:field="*{username}"
                           minlength="4"
                           maxlength="50"
                           pattern="[A-Za-z0-9._-]{4,50}"
                           class="form-control"
                           th:readonly="${esCuentaPropia}"
                           required>

                    <div th:if="${esCuentaPropia}"
                         class="form-text">
                        No puede cambiar su propio nombre
                        de acceso mientras tiene sesión iniciada.
                    </div>
                </div>

                <div class="col-md-6">

                    <label for="correo"
                           class="form-label">
                        Correo electrónico
                    </label>

                    <input id="correo"
                           type="email"
                           th:field="*{correo}"
                           maxlength="150"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6">

                    <label for="rol"
                           class="form-label">
                        Perfil de acceso
                    </label>

                    <select id="rol"
                            th:field="*{rol}"
                            class="form-select"
                            th:disabled="${esCuentaPropia}"
                            required>

                        <option value="EMPLEADO">
                            EMPLEADO
                        </option>

                        <option value="ADMIN">
                            ADMINISTRADOR
                        </option>
                    </select>

                    <input th:if="${esCuentaPropia}"
                           type="hidden"
                           name="rol"
                           value="ADMIN">

                    <div th:if="${esCuentaPropia}"
                         class="form-text">
                        No puede quitarse su propio
                        rol de administrador.
                    </div>
                </div>

                <div class="col-12">

                    <button type="submit"
                            class="btn btn-success">
                        Guardar cambios
                    </button>

                    <a th:href="@{/usuarios}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>

            </div>
        </form>

    </section>

</main>

</body>
</html>
