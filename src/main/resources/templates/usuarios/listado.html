
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Administrar Usuarios - VetControl Perú</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eff6f9;
            color: #173b59;
        }

        header {
            background: linear-gradient(110deg, #103c63, #169c9c);
            padding: 26px;
            color: white;
        }

        .contenedor {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .tarjeta {
            background: white;
            border-radius: 16px;
            border: 1px solid #dce7ed;
            padding: 25px;
            margin-bottom: 25px;
        }

        h2 {
            font-weight: 700;
            color: #123e62;
        }

        .form-label {
            font-weight: 600;
        }

        #tablaUsuarios thead th {
            --bs-table-bg: #16486b;
            --bs-table-color: white;
            background: #16486b !important;
            color: white !important;
            padding: 12px;
        }

        #tablaUsuarios td {
            vertical-align: middle;
        }

        .contador {
            background: #d9f7e8;
            color: #087447;
            padding: 9px 16px;
            border-radius: 25px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<header>
    <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3">
        <div>
            <h1 class="h3 mb-1">
                Administración de Usuarios
            </h1>
            <p class="mb-0">
                VetControl Perú - Gestión de accesos
            </p>
        </div>

        <a th:href="@{/dashboard}" class="btn btn-light">
            Volver al Dashboard
        </a>
    </div>
</header>

<main class="contenedor">

    <div th:if="${mensaje}"
         th:text="${mensaje}"
         class="alert alert-success">
    </div>

    <div th:if="${error}"
         th:text="${error}"
         class="alert alert-danger">
    </div>

    <section class="tarjeta">

        <h2 class="h4 mb-3">Registrar nuevo usuario</h2>

        <!-- FORMULARIO CON TOKEN CSRF -->
        <form th:action="@{/usuarios/guardar}"
              th:object="${formulario}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="nombres" class="form-label">
                        Nombre completo
                    </label>
                    <input id="nombres"
                           type="text"
                           th:field="*{nombres}"
                           class="form-control"
                           maxlength="120"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="username" class="form-label">
                        Usuario
                    </label>
                    <input id="username"
                           type="text"
                           th:field="*{username}"
                           class="form-control"
                           minlength="4"
                           maxlength="50"
                           pattern="[A-Za-z0-9._-]{4,50}"
                           autocomplete="off"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    <input id="correo"
                           type="email"
                           th:field="*{correo}"
                           class="form-control"
                           maxlength="150"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="rol" class="form-label">
                        Rol
                    </label>
                    <select id="rol"
                            th:field="*{rol}"
                            class="form-select"
                            required>
                        <option value="EMPLEADO">EMPLEADO</option>
                        <option value="ADMIN">ADMINISTRADOR</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label">
                        Contraseña inicial
                    </label>

                    <div class="input-group">
                        <input id="password"
                               name="password"
                               type="password"
                               minlength="10"
                               maxlength="72"
                               autocomplete="new-password"
                               class="form-control"
                               required>

                        <button id="mostrarClave"
                                type="button"
                                class="btn btn-outline-secondary">
                            Mostrar
                        </button>
                    </div>

                    <small class="text-secondary">
                        Mínimo 10 caracteres.
                        Se almacenará cifrada con BCrypt.
                    </small>
                </div>

                <div class="col-12">
                    <button type="submit"
                            class="btn btn-success">
                        Registrar usuario
                    </button>

                    <button type="reset"
                            class="btn btn-outline-secondary">
                        Limpiar formulario
                    </button>
                </div>

            </div>
        </form>
    </section>

    <section class="tarjeta">

        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-3 mb-4">

            <h2 class="h4 mb-0">Usuarios registrados</h2>

            <span class="contador"
                  th:text="${totalUsuarios + ' usuarios'}">
                0 usuarios
            </span>
        </div>

        <div class="row g-3 mb-3">

            <div class="col-md-6">
                <input id="buscar"
                       type="search"
                       class="form-control"
                       placeholder="Buscar nombre, usuario o correo">
            </div>

            <div class="col-md-3">
                <select id="filtroRol" class="form-select">
                    <option value="">Todos los roles</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="EMPLEADO">EMPLEADO</option>
                </select>
            </div>

            <div class="col-md-3">
                <button id="limpiar"
                        type="button"
                        class="btn btn-outline-secondary w-100">
                    Limpiar filtros
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="tablaUsuarios"
                   class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="usuario : ${usuarios}"
                        th:attr="data-rol=${usuario.rol}">

                        <td th:text="${usuario.idUsuario}"></td>

                        <td th:text="${usuario.nombres}"></td>

                        <td th:text="${usuario.username}"></td>

                        <td th:text="${usuario.correo}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${usuario.rol == 'ADMIN'} ? 'text-bg-primary' : 'text-bg-secondary'"
                                  th:text="${usuario.rol}">
                            </span>
                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="${usuario.activo == true} ? 'text-bg-success' : 'text-bg-danger'"
                                  th:text="${usuario.activo == true ? 'Activo' : 'Inactivo'}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p id="sinResultados"
           class="alert alert-info"
           style="display:none">
            No se encontraron usuarios.
        </p>

        <p id="resultados"
           class="text-secondary small"></p>
    </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const buscar = document.getElementById("buscar");
    const rol = document.getElementById("filtroRol");
    const limpiar = document.getElementById("limpiar");
    const filas = Array.from(
        document.querySelectorAll("#tablaUsuarios tbody tr")
    );

    function normalizar(valor) {
        return String(valor || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toUpperCase()
            .trim();
    }

    function filtrar() {
        let visibles = 0;

        filas.forEach(function (fila) {
            const texto = normalizar(fila.textContent);
            const rolFila = normalizar(fila.dataset.rol);

            const mostrar =
                texto.includes(normalizar(buscar.value)) &&
                (!rol.value ||
                 rolFila === normalizar(rol.value));

            fila.style.display = mostrar ? "" : "none";

            if (mostrar) visibles++;
        });

        document.getElementById("sinResultados")
            .style.display = visibles === 0 ? "block" : "none";

        document.getElementById("resultados")
            .textContent =
                "Mostrando " + visibles + " de " +
                filas.length + " usuarios";
    }

    buscar.addEventListener("input", filtrar);
    rol.addEventListener("change", filtrar);

    limpiar.addEventListener("click", function () {
        buscar.value = "";
        rol.value = "";
        filtrar();
    });

    document.getElementById("mostrarClave")
        .addEventListener("click", function () {
            const campo = document.getElementById("password");
            campo.type =
                campo.type === "password" ? "text" : "password";
        });

    filtrar();
});
</script>
</body>
</html>
